plugins {
    id 'com.android.application'
}

def apiUrl = providers.gradleProperty('API_BASE_URL').getOrElse('http://10.0.2.2:18080/')
if (!(apiUrl.startsWith('https://') || apiUrl.startsWith('http://')) || !apiUrl.endsWith('/')) {
    throw new GradleException('API_BASE_URL debe ser una URL HTTP/HTTPS y terminar en /.')
}

android {
    namespace 'com.lara.denunciasapp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lara.denunciasapp'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'API_BASE_URL', '"' + apiUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
